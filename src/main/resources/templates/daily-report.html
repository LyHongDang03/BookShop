<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Order Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333333;
        }
        .report-details {
            font-size: 16px;
            line-height: 1.6;
        }
        .report-details strong {
            color: #555;
        }
        .summary-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        .summary-table td {
            padding: 12px;
            border-top: 1px solid #eee;
        }
        .summary-table .label {
            font-weight: bold;
        }
        .summary-table .value {
            text-align: right;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Daily Sales Report</h1>
    <div class="report-details">
        <p>Here is the sales summary for <strong><span th:text="${#temporals.format(date, 'dd-MM-yyyy')}">[Date]</span></strong>.</p>
        <table class="summary-table">
            <tr><td class="label">Total Orders:</td><td class="value" th:text="${totalOrders}">0</td></tr>
            <tr><td class="label">Total Revenue:</td><td class="value" th:text="${#numbers.formatDecimal(totalAmount, 1, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</td></tr>
        </table>
    </div>
    <p class="footer">This is an automated report from Book Shop.</p>
</div>
</body>
</html>
